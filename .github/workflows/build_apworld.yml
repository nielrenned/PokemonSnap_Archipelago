name: Build AP World

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: List Initial Files
        run: ls -la
      - name: Remove Excess Files
        run: |
          rm -rf .github
          rm -rf docs
          rm -rf test
          rm -rf .git
          rm -rf .gitignore
      - name: List Remaining Files
        run: ls -la
      - name: Zip apworld
        run: |
          cd ..
          ls -la
          zip -r pokemon_snap.apworld ${{ github.event.repository.name }}
          mv pokemon_snap.apworld ${{ github.event.repository.name }}
      - name: List Files With Zip
        run: ls -la
      - name: List Files in Zip
        run: unzip -l pokemon_snap.apworld
      - name: Attach apworld to release
        uses: softprops/action-gh-release@v3
        with:
          files: pokemon_snap.apworld