name: Build AP World

# on:
#   release:
#     types: [published]

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Archipelago
        uses: actions/checkout@v6
        with:
          repository: ArchipelagoMW/Archipelago
          path: Archipelago
          ref: 0.6.7
      - name: Clear worlds folder
        run: rm -rf Archipelago/worlds/*
      - name: Checkout Pokemon Snap
        uses: actions/checkout@v6
        with:
          path: Archipelago/worlds/pokemon_snap
      - name: Build Multiworld
        run: |
          cd Archipelago
          python -m pip install -r requirements.txt
          python Launcher.py "Build APWorlds"
      - name: Attach apworld to release
        uses: softprops/action-gh-release@v3
        with:
          files: Archipelago/build/pokemon_snap.apworld