name: Build AP World

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: pokemon_snap
      - name: Remove Excess Files
        run: |
          cd pokemon_snap
          rm -rf .github
          rm -rf docs
          rm -rf test
          rm -rf .git
          rm -rf .gitignore
      - name: Zip apworld
        run: zip -r pokemon_snap.apworld pokemon_snap
      - name: Attach apworld to release
        uses: softprops/action-gh-release@v3
        with:
          files: pokemon_snap.apworld